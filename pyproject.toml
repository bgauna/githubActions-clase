[project]
name = "calculadora-ci"
version = "0.1.0"
description = "Proyecto educativo para practicar testing, integración continua y GitHub Actions."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
